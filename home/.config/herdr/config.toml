onboarding = false

[theme]
name = "terminal"
auto_switch = false

# Arctic (VS Code Dark+) colors, matched to Neovim.
[theme.custom]
accent = "#D4D4D4"
panel_bg = "#252526"
surface0 = "#04395E"
surface1 = "#2A2D2E"
surface_dim = "#2D2D2D"
overlay0 = "#858585"
overlay1 = "#A9A9A9"
text = "#D4D4D4"
subtext0 = "#8F8F8F"
mauve = "#C586C0"
green = "#89D185"
yellow = "#CCA700"
red = "#F14C4C"
blue = "#3794FF"
teal = "#4EC9B0"
peach = "#CE9178"

[keys]
prefix = "ctrl+g"
settings = "prefix+c"
workspace_picker = "prefix+s"
navigate_workspace_up = "k"
navigate_workspace_down = "j"
navigate_pane_left = "h"
navigate_pane_right = "l"
previous_agent = "prefix+k"
next_agent = "prefix+j"
focus_agent = "prefix+shift+1..9"
new_workspace = "prefix+ctrl+s"
close_workspace = "prefix+x"
detach = "prefix+d"
new_tab = "prefix+t"
rename_tab = "prefix+r"
previous_tab = "prefix+p"
next_tab = "prefix+n"
switch_tab = "prefix+1..9"
close_tab = "prefix+q"
edit_scrollback = "prefix+e"
copy_mode = "prefix+["
toggle_sidebar = "prefix+b"

# Tabs are the only navigation level inside a workspace.
rename_pane = ""
focus_pane_left = ""
focus_pane_down = ""
focus_pane_up = ""
focus_pane_right = ""
swap_pane_left = ""
swap_pane_down = ""
swap_pane_up = ""
swap_pane_right = ""
cycle_pane_next = ""
cycle_pane_previous = ""
last_pane = ""
split_vertical = ""
split_horizontal = ""
close_pane = ""
zoom = ""
resize_mode = ""

[ui]
agent_panel_sort = "priority"
sidebar_width = 48
sidebar_min_width = 24
sidebar_max_width = 72
sidebar_start_collapsed = true
sidebar_collapsed_mode = "hidden"
pane_borders = false
pane_scrollbars = false
hide_tab_bar_when_single_tab = true
tab_bar_position = "top"
prompt_new_tab_name = false

[ui.sound]
enabled = false
