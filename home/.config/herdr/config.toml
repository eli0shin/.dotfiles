onboarding = false

[theme]
name = "terminal"
auto_switch = false

# Arctic (VS Code Dark+) colors, matched to Neovim.
[theme.custom]
accent = "#858585"
panel_bg = "#252526"
active_row_bg = "#2D2D2D"
selection_bg = "#04395E"
surface0 = "#04395E"
surface1 = "#2A2D2E"
surface_dim = "#2D2D2D"
overlay0 = "#858585"
overlay1 = "#A9A9A9"
text = "#D4D4D4"
subtext0 = "#8F8F8F"
mauve = "#C586C0"
green = "#89D185"
yellow = "#CCA700"
red = "#F14C4C"
blue = "#3794FF"
teal = "#4EC9B0"
peach = "#CE9178"

[keys]
prefix = "ctrl+g"
settings = "prefix+c"
workspace_picker = "prefix+s"
navigate_workspace_up = "k"
navigate_workspace_down = "j"
navigate_pane_left = "h"
navigate_pane_right = "l"
previous_agent = "prefix+k"
next_agent = "prefix+j"
focus_agent = "prefix+shift+1..9"
new_workspace = "prefix+ctrl+s"
close_workspace = "prefix+x"
detach = "prefix+d"
new_tab = "prefix+t"
rename_tab = "prefix+r"
previous_tab = "prefix+p"
next_tab = "prefix+n"
switch_tab = "prefix+1..9"
close_tab = "prefix+shift+q"
edit_scrollback = "prefix+e"
copy_mode = "prefix+["
toggle_sidebar = "prefix+b"

# Tabs are the only navigation level inside a workspace.
rename_pane = ""
# Direct ctrl+h/j/k/l navigation is handled by herdr-navigator below.
focus_pane_left = ""
focus_pane_down = ""
focus_pane_up = ""
focus_pane_right = ""
swap_pane_left = ""
swap_pane_down = ""
swap_pane_up = ""
swap_pane_right = ""
cycle_pane_next = ""
cycle_pane_previous = ""
last_pane = ""
split_vertical = "prefix+v"
split_horizontal = "prefix+h"
close_pane = "prefix+q"
zoom = ""
resize_mode = ""

[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "herdr-navigator.left"
description = "navigate left (nvim/herdr)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "herdr-navigator.down"
description = "navigate down (nvim/herdr)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "herdr-navigator.up"
description = "navigate up (nvim/herdr)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "herdr-navigator.right"
description = "navigate right (nvim/herdr)"

# Lumen has fixed ctrl+j/k file-navigation keys. These aliases preserve direct
# ctrl+j/k for vertical pane navigation and pass alt+j/k through elsewhere.
[[keys.command]]
key = "alt+j"
type = "shell"
command = "\"$HOME/.local/bin/herdr-lumen-file-nav\" next"
description = "next Lumen file (otherwise send alt+j)"

[[keys.command]]
key = "alt+k"
type = "shell"
command = "\"$HOME/.local/bin/herdr-lumen-file-nav\" previous"
description = "previous Lumen file (otherwise send alt+k)"

# ctrl+l is reserved for navigation, so prefix+ctrl+l clears the shell.
[[keys.command]]
key = "prefix+ctrl+l"
type = "shell"
command = "\"$HERDR_BIN_PATH\" pane send-keys \"$HERDR_ACTIVE_PANE_ID\" ctrl+l"
description = "send ctrl+l (clear screen) to pane"

[ui]
agent_panel_sort = "priority"
sidebar_width = 48
sidebar_min_width = 24
sidebar_max_width = 72
sidebar_start_collapsed = true
sidebar_collapsed_mode = "hidden"
pane_borders = true
pane_outer_borders = false
pane_gaps = false
pane_scrollbars = false
hide_tab_bar_when_single_tab = false
tab_bar_position = "top"
tab_bar_right = [{ type = "hostname" }]
prompt_new_tab_name = false

[ui.sound]
enabled = false

[experimental]
kitty_graphics = true


# Terminal annotations
[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "annotate.capture"
description = "annotate text"

[[keys.command]]
key = "prefix+shift+a"
type = "plugin_action"
command = "annotate.copy-context"
description = "copy annotations as context"

[[keys.command]]
key = "prefix+ctrl+a"
type = "plugin_action"
command = "annotate.copy-archive"
description = "copy annotations as context and archive them"

[[keys.command]]
key = "prefix+m"
type = "plugin_action"
command = "annotate.manage"
description = "manage annotations"

# Document review (plannotator-tui)
[[keys.command]]
key = "prefix+o"
type = "plugin_action"
command = "annotate.open"
description = "review documents in this folder"

[[keys.command]]
key = "prefix+shift+o"
type = "plugin_action"
command = "annotate.last"
description = "review the agent's last reply"
